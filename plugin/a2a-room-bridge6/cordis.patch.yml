- insert:
    - id: a2a-room-bridge6
      name: '@local/a2a-room-bridge6'
      config:
        hubUrl: http://127.0.0.1:8787
        roomId: fusion-data-academy
        pollMs: 1500
        autoBind: true
        autoBindIntervalMs: 15000
        autoBindExclude:
          - h2
        wakeBatchWindowMs: 8000
        maxBatchMessages: 8
        digestMessageChars: 300
        digestMaxChars: 4000
        wakeGuard:
          maxWakesPerHour: 20
          maxWakesPerMinute: 5
          minIntervalMs: 5000
